[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "university-work-platform"
version = "0.1.0"
description = "Telegram Mini App marketplace MVP"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5,<7",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.26,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["packages/backend"]
include = ["platform_core*", "modules*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
